name: Defence Bot Private Registration

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Telegram update type"
        required: false
      thread_id:
        description: "Telegram thread ID"
        required: false
      update_json:
        description: "Private Telegram update JSON"
        required: true

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Register private chat
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
          DEFENCE_REGISTER_UPDATE_JSON: ${{ inputs.update_json }}
        run: python defence_register.py
