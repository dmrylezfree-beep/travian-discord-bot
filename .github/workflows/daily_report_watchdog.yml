name: Daily Travian Report Watchdog

on:
  schedule:
    # Main report is scheduled for 03:15 UTC. Give GitHub cron 45 minutes
    # and repair a missed run at 04:00 UTC.
    - cron: '0 4 * * *'
    # Second safety check in case the first watchdog cron is also delayed/skipped.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure today's daily report ran
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          today = datetime.now(timezone.utc).date().isoformat()

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "travian-daily-watchdog",
          }

          def github(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=40) as response:
                  raw = response.read().decode()
                  return response.status, json.loads(raw) if raw else {}

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/run.yml/runs"
              f"?branch=main&per_page=30"
          )
          _, payload = github(runs_url)
          runs = payload.get("workflow_runs", [])

          todays = [
              run for run in runs
              if (run.get("created_at") or "").startswith(today)
          ]

          if todays:
              print("Daily Travian Report already has a run today:")
              for run in todays:
                  print(
                      run.get("id"),
                      run.get("status"),
                      run.get("conclusion"),
                      run.get("event"),
                      run.get("created_at"),
                  )
              raise SystemExit(0)

          print(f"No Daily Travian Report run found for {today}. Dispatching it now.")
          dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/run.yml/dispatches"
          status, _ = github(
              dispatch_url,
              method="POST",
              body={"ref": "main"},
          )
          if status != 204:
              raise RuntimeError(f"Unexpected workflow dispatch status: {status}")
          print("Daily Travian Report dispatched successfully.")
          PY
