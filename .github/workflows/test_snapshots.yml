name: Test historical snapshots

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Compare snapshots
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import travian_bot

          previous_path = Path(
              "data/snapshots/2026/09/map_2026-09-05.sql"
          )

          today_path = Path(
              "data/snapshots/2026/09/map_2026-09-06.sql"
          )

          print("========================================")
          print("TRAVIAN HISTORICAL SNAPSHOT TEST")
          print("========================================")

          if not previous_path.exists():
              print(f"ERROR: file not found: {previous_path}")
              sys.exit(1)

          if not today_path.exists():
              print(f"ERROR: file not found: {today_path}")
              sys.exit(1)

          raw_previous = previous_path.read_text(
              encoding="utf-8"
          )

          raw_today = today_path.read_text(
              encoding="utf-8"
          )

          print(f"Previous snapshot: {previous_path}")
          print(f"Current snapshot:  {today_path}")
          print(f"05.09 size: {len(raw_previous):,} characters")
          print(f"06.09 size: {len(raw_today):,} characters")

          print()
          print("Running comparison...")

          results = travian_bot.compare_snapshots(
              raw_today,
              raw_previous
          )

          print()
          print("Sending reports to Telegram...")

          travian_bot.send_reports(results)

          print()
          print("========================================")
          print("TEST COMPLETED SUCCESSFULLY")
          print("========================================")
          PY
