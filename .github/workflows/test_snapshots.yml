name: Test historical snapshots

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Compare snapshots
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import travian_bot

          day_before_path = Path(
              "data/snapshots/2026/09/map_2026-09-04.sql"
          )

          previous_path = Path(
              "data/snapshots/2026/09/map_2026-09-05.sql"
          )

          today_path = Path(
              "data/snapshots/2026/09/map_2026-09-06.sql"
          )

          print("========================================")
          print("TRAVIAN HISTORICAL SNAPSHOT TEST")
          print("========================================")

          for path in [
              day_before_path,
              previous_path,
              today_path,
          ]:
              if not path.exists():
                  print(f"ERROR: file not found: {path}")
                  sys.exit(1)

          raw_day_before = day_before_path.read_text(
              encoding="utf-8"
          )

          raw_previous = previous_path.read_text(
              encoding="utf-8"
          )

          raw_today = today_path.read_text(
              encoding="utf-8"
          )

          print(f"04.09: {len(raw_day_before):,} characters")
          print(f"05.09: {len(raw_previous):,} characters")
          print(f"06.09: {len(raw_today):,} characters")

          # ==================================================
          # ОБЫЧНОЕ СРАВНЕНИЕ
          # ==================================================

          print()
          print("========================================")
          print("RUNNING 24-HOUR COMPARISON")
          print("========================================")

          results = travian_bot.compare_snapshots(
              raw_today,
              raw_previous
          )

          # ==================================================
          # HERO
          # ==================================================

          print()
          print("========================================")
          print("RUNNING HERO ALLIANCE CHECK")
          print("========================================")

          enemy_activity = (
              travian_bot.find_enemy_alliance_activity(
                  raw_today,
                  raw_previous
              )
          )

          print()
          print("Hero alliance ID:")
          print(enemy_activity["alliance_id"])

          print(
              "Hero alliance name:"
              f" {enemy_activity['alliance']}"
          )

          print(
              "Hero villages today:"
              f" {len(enemy_activity['founded'])}"
              " newly founded / "
              f"{len(enemy_activity['captured'])}"
              " captured / "
              f"{len(enemy_activity['lost'])}"
              " lost"
          )

          # ==================================================
          # НЕАКТИВНОСТЬ 3 ДНЯ
          # ==================================================

          print()
          print("========================================")
          print("RUNNING 3-DAY INACTIVITY CHECK")
          print("========================================")

          inactive_players_3d = (
              travian_bot.find_inactive_3_days(
                  raw_today,
                  raw_previous,
                  raw_day_before
              )
          )

          print(
              f"Players inactive for 3 days: "
              f"{len(inactive_players_3d)}"
          )

          # ==================================================
          # ОТПРАВКА ОТЧЁТОВ
          # ==================================================

          print()
          print("========================================")
          print("SENDING REPORTS TO TELEGRAM")
          print("========================================")

          travian_bot.send_reports(
              results,
              inactive_players_3d,
              enemy_activity
          )

          print()
          print("========================================")
          print("TEST COMPLETED SUCCESSFULLY")
          print("========================================")
          PY
