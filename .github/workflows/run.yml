name: Daily Travian Report

on:
  schedule:
    - cron: '15 5 * * *'  # Каждый день в 08:15 по МСК (05:15 UTC)
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # Запускаем скрипт, который создаст current_map.sql и yesterday_map.sql
    - name: Run script
      run: python travian_bot.py

    # Финальный шаг: Железно сохраняем ОБА файла на вкладку Code при ЛЮБОМ запуске
    - name: Commit and Push Database Files
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add current_map.sql yesterday_map.sql || true
        git commit -m "Update Travian database files (current and yesterday)" || true
        git pull origin main --rebase -X theirs || true
        git push origin HEAD:main || true
