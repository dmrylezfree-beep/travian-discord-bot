name: Daily Travian Report

on:
  schedule:
    - cron: '15 3 * * *'  # 06:15 МСК (03:15 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download independent Travian snapshot
        run: python github_snapshot_download.py

      - name: Commit historical snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/snapshots/

          if git diff --cached --quiet; then
            echo "No new snapshot or state changes to commit."
            exit 0
          fi

          git commit -m "Add Travian snapshot $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
