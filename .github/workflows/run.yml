name: Daily Travian Report

on:
  schedule:
    - cron: '0 4 * * *'  # Каждый день в 07:00 по МСК
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 1. Готовим файлы: если бэкап в репозитории существует, делаем его вчерашней базой
    - name: Prepare Database Files
      run: |
        if [ -f "map_database_backup.txt" ]; then
          cp map_database_backup.txt map_yesterday.txt
          echo "Вчерашняя база успешно восстановлена из бэкапа."
        else
          echo "Файл бэкапа отсутствует (это самый первый запуск ботом)."
        fi

    # 2. Запускаем скрипт бота
    - name: Run script
      run: python travian_bot.py

    # 3. Сохраняем свежий файл прямо в файлы вашего репозитория (вкладка Code)
    - name: Commit and Push Database Backup
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        cp map_today.txt map_database_backup.txt || true
        git add map_database_backup.txt || true
        git commit -m "Update Travian database backup" || true
        git pull origin main --rebase -X theirs || true
        git push origin HEAD:main || true
