name: Daily Travian Report

on:
  schedule:
    - cron: '15 5 * * *'  # 08:15 МСК (05:15 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Travian analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python travian_bot.py

      - name: Commit historical snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/snapshots/ data/inactive_state.json

          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
            exit 0
          fi

          git commit -m "Add Travian snapshot $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
