name: Daily Travian Report

on:
  schedule:
    # Запуск каждый день в 04:00 по UTC (7:00 по МСК)
    - cron: '0 4 * * *'
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: python travian_bot.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add map_today.txt map_yesterday.txt || true
        git commit -m "Update Travian map database" || true
        git push || true
