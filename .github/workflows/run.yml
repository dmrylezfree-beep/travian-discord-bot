name: Daily Travian Report

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Скачивает полную историю, чтобы избежать конфликтов при push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: python travian_bot.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add map_today.txt map_yesterday.txt || true
        git commit -m "Update Travian map database" || true
        
        # Перед отправкой стягиваем изменения, если они были, автоматически разрешая конфликты в пользу новых файлов
        git pull origin main --rebase -X theirs || true
        git push origin HEAD:main
