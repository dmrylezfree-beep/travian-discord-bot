name: Defence Bot Discord Sync

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: false
        default: "discord_sync"
      thread_id:
        description: "Telegram thread ID (legacy, ignored)"
        required: false
        default: "38636"
      update_json:
        description: "Legacy input (ignored)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: defence-discord-sync
  cancel-in-progress: false

jobs:
  discord-sync:
    if: inputs.action == 'discord_sync'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Sync Discord contribution to Telegram
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import defence_requests as defence
          defence.refresh_center(create_if_missing=True)
          defence.refresh_optimal_plans(force=True)
          print("Discord contribution synced to Telegram.", flush=True)
          PY
