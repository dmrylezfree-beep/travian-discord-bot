name: Defence Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Legacy action input"
        required: false
        default: "message"
      chat_id:
        description: "Legacy chat ID"
        required: false
        default: ""
      message_id:
        description: "Legacy message ID"
        required: false
        default: ""
      thread_id:
        description: "Telegram thread ID"
        required: false
        default: "38636"
      user_id:
        description: "Legacy user ID"
        required: false
        default: ""
      username:
        description: "Legacy username"
        required: false
        default: ""
      first_name:
        description: "Legacy first name"
        required: false
        default: ""
      message_text:
        description: "Legacy message text"
        required: false
        default: ""
      callback_id:
        description: "Legacy callback ID"
        required: false
        default: ""
      callback_data:
        description: "Legacy callback data"
        required: false
        default: ""

permissions:
  contents: write

# Only one short defence session may run at a time.
concurrency:
  group: defence-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Switch Telegram from webhook to polling
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["DEFENCE_TELEGRAM_TOKEN"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/deleteWebhook",
              data={"drop_pending_updates": "false"},
              timeout=40,
          )
          response.raise_for_status()
          result = response.json()
          print(result, flush=True)
          if not result.get("ok"):
              raise SystemExit(1)
          PY

      - name: Run defence bot
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
          DEFENCE_RUN_SECONDS: "510"
          DEFENCE_TG_POLL_TIMEOUT: "20"
        run: python defence_poll.py

      - name: Restore Telegram webhook
        if: always()
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["DEFENCE_TELEGRAM_TOKEN"]
          webhook_url = "https://travian-defence.dmrylezfree.workers.dev/"
          response = requests.post(
              f"https://api.telegram.org/bot{token}/setWebhook",
              data={"url": webhook_url, "allowed_updates": '["message","callback_query"]'},
              timeout=40,
          )
          response.raise_for_status()
          result = response.json()
          print(result, flush=True)
          if not result.get("ok"):
              raise SystemExit(1)
          PY
