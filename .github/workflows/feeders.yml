name: Travian Feeders Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: "feeders"
      chat_id:
        description: "Telegram chat ID"
        required: true
      message_id:
        description: "Telegram message ID"
        required: false
        default: ""
      thread_id:
        description: "Telegram thread ID"
        required: false
        default: "75984"
      origin_spec:
        description: "Origin villages/players"
        required: false
        default: ""
      page:
        description: "Page number"
        required: false
        default: "0"
      callback_id:
        description: "Telegram callback query ID"
        required: false
        default: ""

jobs:
  feeders:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run feeders bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          FEEDER_CHAT_ID: ${{ inputs.chat_id }}
          FEEDER_MESSAGE_ID: ${{ inputs.message_id }}
          FEEDER_THREAD_ID: ${{ inputs.thread_id }}
          FEEDER_ORIGIN_SPEC: ${{ inputs.origin_spec }}
          FEEDER_PAGE: ${{ inputs.page }}
          FEEDER_CALLBACK_ID: ${{ inputs.callback_id }}

          TRAVIAN_MAP_SIZE: "401"

        run: |
          python telegram_bot.py
