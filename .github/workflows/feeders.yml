name: Travian Feeders Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: false
        default: "message"
      update_json:
        description: "Initial Telegram update"
        required: false
        default: ""

jobs:
  feeders:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: feeders-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore webhook only
        if: inputs.action == 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FEEDERS_WEBHOOK_URL: ${{ secrets.FEEDERS_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/setWebhook",
              json={
                  "url": os.environ["FEEDERS_WEBHOOK_URL"],
                  "allowed_updates": ["message", "callback_query"],
              },
              timeout=40,
          )
          print(r.status_code, r.text)
          r.raise_for_status()
          PY

      - name: Switch to polling
        if: inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/deleteWebhook",
              json={"drop_pending_updates": False},
              timeout=40,
          )
          print(r.status_code, r.text)
          r.raise_for_status()
          PY

      - name: Run feeders bot
        if: inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FEEDERS_INITIAL_UPDATE_JSON: ${{ inputs.update_json }}
          FEEDERS_RUN_SECONDS: "510"
          TRAVIAN_MAP_SIZE: "401"
        run: python feeders_poll.py

      - name: Restore webhook
        if: always() && inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FEEDERS_WEBHOOK_URL: ${{ secrets.FEEDERS_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, requests
          url = os.environ.get("FEEDERS_WEBHOOK_URL", "").strip()
          if not url:
              raise RuntimeError("FEEDERS_WEBHOOK_URL secret is not configured")
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/setWebhook",
              json={
                  "url": url,
                  "allowed_updates": ["message", "callback_query"],
              },
              timeout=40,
          )
          print(r.status_code, r.text)
          r.raise_for_status()
          PY
