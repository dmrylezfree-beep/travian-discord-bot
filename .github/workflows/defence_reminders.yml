name: Defence Reminders

# Reminders are started on demand when a player confirms a defence send.
# There is deliberately no permanent cron: when nobody has a pending
# reminder, this workflow consumes no GitHub Actions time.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: defence-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Send due defence reminders
        env:
          DEFENCE_TELEGRAM_TOKEN: ${{ secrets.DEFENCE_TELEGRAM_TOKEN }}
        run: python defence_reminders.py
