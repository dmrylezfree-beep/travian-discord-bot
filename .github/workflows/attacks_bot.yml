name: Incoming Attacks Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Run attacks bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.ATTACKS_TELEGRAM_TOKEN }}
        run: python attacks_bot.py
