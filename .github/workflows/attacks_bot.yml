name: Incoming Attacks Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Telegram update type"
        required: false
        default: "message"
      thread_id:
        description: "Telegram thread ID"
        required: false
        default: "76303"
      update_json:
        description: "Initial Telegram update JSON to process"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: attacks-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Restore Telegram webhook only
        if: inputs.action == 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.ATTACKS_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, requests
          token = os.environ["TELEGRAM_TOKEN"]
          url = "https://travian-attacks.dmrylezfree.workers.dev/"
          api = f"https://api.telegram.org/bot{token}/setWebhook"
          last = None
          for attempt in range(1, 4):
              try:
                  r = requests.post(api, data={
                      "url": url,
                      "allowed_updates": '["message","callback_query"]',
                  }, timeout=40)
                  print(f"Attempt {attempt}: {r.status_code} {r.text}", flush=True)
                  if r.ok and r.json().get("ok"):
                      raise SystemExit(0)
                  last = r.text
              except SystemExit:
                  raise
              except Exception as exc:
                  last = repr(exc)
              if attempt < 3:
                  time.sleep(5)
          raise SystemExit(f"Failed to restore webhook: {last}")
          PY

      - name: Switch Telegram from webhook to polling
        if: inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.ATTACKS_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["TELEGRAM_TOKEN"]
          r = requests.post(
              f"https://api.telegram.org/bot{token}/deleteWebhook",
              data={"drop_pending_updates": "false"},
              timeout=40,
          )
          print(r.status_code, r.text, flush=True)
          if not r.ok or not r.json().get("ok"):
              raise SystemExit(1)
          PY

      - name: Run attacks bot
        if: inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.ATTACKS_TELEGRAM_TOKEN }}
          BOT_OWNER_ID: ${{ secrets.BOT_OWNER_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          ATTACKS_RUN_SECONDS: "510"
          ATTACKS_TG_POLL_TIMEOUT: "20"
          ATTACKS_INITIAL_UPDATE_JSON: ${{ inputs.update_json }}
        run: python attacks_poll.py

      - name: Restore Telegram webhook
        if: always() && inputs.action != 'restore_webhook'
        env:
          TELEGRAM_TOKEN: ${{ secrets.ATTACKS_TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, requests
          token = os.environ["TELEGRAM_TOKEN"]
          url = "https://travian-attacks.dmrylezfree.workers.dev/"
          api = f"https://api.telegram.org/bot{token}/setWebhook"
          last = None
          for attempt in range(1, 4):
              try:
                  r = requests.post(api, data={
                      "url": url,
                      "allowed_updates": '["message","callback_query"]',
                  }, timeout=40)
                  print(f"Attempt {attempt}: {r.status_code} {r.text}", flush=True)
                  if r.ok and r.json().get("ok"):
                      raise SystemExit(0)
                  last = r.text
              except SystemExit:
                  raise
              except Exception as exc:
                  last = repr(exc)
              if attempt < 3:
                  time.sleep(5)
          print(f"WARNING: failed to restore webhook: {last}", flush=True)
          raise SystemExit(1)
          PY
